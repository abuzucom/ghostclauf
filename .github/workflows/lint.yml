name: Lint

on:
    push:
        branches:
            - main
        paths: &lint-paths
            - '**/*.py'
            - '**/*.sh'
            - ruff.toml
            - Dockerfile
            - .github/workflows/**
    pull_request:
        branches:
            - main
        paths: *lint-paths

concurrency:
    group: lint-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    ruff:
        name: Ruff (Python)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
              with:
                  version: 0.15.8
                  args: check --output-format=github
                  src: scripts hooks tests

    shellcheck:
        name: ShellCheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            # ShellCheck ships preinstalled on ubuntu-latest runners.
            - run: shellcheck -x setup.sh run.sh publish-site.sh scripts/node-env.sh

    actionlint:
        name: actionlint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
              with:
                  # The default is `latest`; pin it. 1.7.12 accepts the YAML
                  # anchors in ci.yml and this file; 1.7.7 rejects them.
                  version: 1.7.12

    hadolint:
        name: hadolint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
              with:
                  dockerfile: Dockerfile
