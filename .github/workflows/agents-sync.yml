name: AGENTS.md sync check

on:
    push:
        paths:
            - AGENTS.md
            - CLAUDE.md
            - GEMINI.md
            - CONVENTIONS.md
            - .cursorrules
            - .clinerules
            - .windsurfrules
            - .copilot-instructions
            - .github/copilot-instructions.md
            - scripts/sync.py
            - scripts/check_ascii.py
            - scripts/check_us_spelling.py
            - scripts/check_english_only.py
    pull_request:
        paths:
            - AGENTS.md
            - CLAUDE.md
            - GEMINI.md
            - CONVENTIONS.md
            - .cursorrules
            - .clinerules
            - .windsurfrules
            - .copilot-instructions
            - .github/copilot-instructions.md
            - scripts/sync.py
            - scripts/check_ascii.py
            - scripts/check_us_spelling.py
            - scripts/check_english_only.py

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - run: python3 scripts/sync.py --check
            - run: python3 scripts/check_ascii.py AGENTS.md
            - run: python3 scripts/check_us_spelling.py AGENTS.md
            - run: python3 scripts/check_english_only.py AGENTS.md
