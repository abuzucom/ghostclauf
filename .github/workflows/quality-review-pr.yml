---
name: quality-review-pr

# Runs the abuzucom/euler quality review on this repository's pull requests.
# Adapted from euler's quality-review-pr.yml caller: the trigger fires on the
# AGENTS.md compliance workflow, which runs on every pull request, and the
# euler references are pinned to a full commit SHA of abuzucom/euler instead
# of the local default-branch revision. The workflow_run trigger runs
# default-branch code after the trigger workflow completes. Pull request
# files stay review data. Fork pull requests receive an explicit skip result
# and no secret.
#
# Upgrade: set EULER_PIN to a new full commit SHA in both places, update the
# version comment, and diff this file against the new upstream caller.

'on':
    workflow_run:
        workflows: ['AGENTS.md compliance']
        types: [completed]

# Each job declares only the permissions it uses.
permissions:
    contents: read

jobs:
    resolve:
        if: github.event.workflow_run.event == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            found: ${{ steps.pr.outputs.found }}
            same_repo: ${{ steps.pr.outputs.same_repo }}
            number: ${{ steps.pr.outputs.number }}
            base_sha: ${{ steps.pr.outputs.base_sha }}
            head_sha: ${{ steps.pr.outputs.head_sha }}
            title: ${{ steps.pr.outputs.title }}
            body: ${{ steps.pr.outputs.body }}
        steps:
            - name: Resolve pull request from the head revision
              id: pr
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
              with:
                  script: |
                      const headSha = process.env.HEAD_SHA;
                      const pulls = await github.paginate(github.rest.pulls.list, { ...context.repo, state: 'open' });
                      const matches = pulls.filter((pull) => pull.head.sha === headSha);
                      if (matches.length !== 1) {
                        core.setOutput('found', 'false');
                        return;
                      }
                      const pull = matches[0];
                      core.setOutput('found', 'true');
                      const sameRepo = Boolean(pull.head.repo) && pull.head.repo.full_name === pull.base.repo.full_name;
                      core.setOutput('same_repo', String(sameRepo));
                      core.setOutput('number', String(pull.number));
                      core.setOutput('base_sha', pull.base.sha);
                      core.setOutput('head_sha', pull.head.sha);
                      core.setOutput('title', pull.title || '');
                      core.setOutput('body', pull.body || '');

    review:
        needs: resolve
        permissions:
            contents: read
            pull-requests: write
            checks: write
        if: needs.resolve.outputs.found == 'true' && needs.resolve.outputs.same_repo == 'true'
        # Euler main as of 2026-10-07.
        uses: abuzucom/euler/.github/workflows/quality-review.yml@fcda240de46de3bd85e17cd49bdfa8a7f7cdbf08
        with:
            pr_number: ${{ fromJSON(needs.resolve.outputs.number) }}
            base_sha: ${{ needs.resolve.outputs.base_sha }}
            head_sha: ${{ needs.resolve.outputs.head_sha }}
            pr_title: ${{ needs.resolve.outputs.title }}
            pr_body: ${{ needs.resolve.outputs.body }}
            # Must match the uses: pin. github.sha would name this repository's
            # default-branch revision, which holds no euler checkout.
            quality_ref: fcda240de46de3bd85e17cd49bdfa8a7f7cdbf08
            fail_on_block: true
            # The public snapshot is generated; reviewing it adds noise.
            exclude_paths: 'site/data/**'
        secrets:
            MODEL_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

    fork-skip:
        needs: resolve
        if: needs.resolve.outputs.found == 'true' && needs.resolve.outputs.same_repo != 'true'
        runs-on: ubuntu-latest
        permissions:
            checks: write
        steps:
            - name: Publish skip result
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
              with:
                  script: |
                      await github.rest.checks.create({
                        ...context.repo,
                        name: 'quality-review',
                        head_sha: process.env.HEAD_SHA,
                        status: 'completed',
                        conclusion: 'skipped',
                        output: {
                          title: 'Skipped for fork pull request',
                          summary: 'Fork pull requests receive no provider secret.',
                        },
                      });
