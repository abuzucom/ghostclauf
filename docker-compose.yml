services:
    ghostclauf:
        build: .
        image: ghostclauf:latest
        restart: unless-stopped
        env_file: .env
        environment:
            # Token store lives on the named volume so it survives restarts.
            TOKEN_STORE_PATH: /data/tokens.json
        ports:
            # Used by the one-time auth flow. The bot's /healthz and /readyz
            # endpoints reuse this port but bind loopback-only by default, so
            # they are reachable via `docker exec` or a same-host healthcheck,
            # not through this published mapping (see README).
            - '3000:3000'
        volumes:
            - ./config.yaml:/app/config.yaml:ro
            - ghostclauf-data:/data
            # Broadcaster token paths in config.yaml are relative to /app locally.
            - ghostclauf-data:/app/data
            # Optional: drop in external plugins without rebuilding the image.
            # Point plugins.directories at /data/plugins in config.yaml (default).
            # - ./plugins:/data/plugins:ro

volumes:
    ghostclauf-data:
