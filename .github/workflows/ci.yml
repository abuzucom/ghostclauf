name: CI

on:
    push:
        branches:
            - main
        paths: &ci-paths
            - src/**
            - test/**
            - site/**
            - scripts/**
            - package.json
            - package-lock.json
            - tsconfig.json
            - tsconfig.eslint.json
            - eslint.config.mjs
            - .prettierrc
            - .prettierignore
            - .htmlvalidate.json
            - .stylelintrc.json
            - config.example.yaml
            - Dockerfile
            - .dockerignore
            - .github/workflows/ci.yml
    pull_request:
        branches:
            - main
        paths: *ci-paths

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    node:
        name: Node ${{ matrix.node-version }} on ubuntu-latest
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version:
                    - 20
                    - 22
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
                  cache-dependency-path: package-lock.json
            - run: npm ci
            - run: npm audit --audit-level=high
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run lint:site
            - run: python scripts/check_public_site.py
            - run: npm test
            - run: npm run build

    platform-smoke:
        name: Platform smoke test on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os:
                    - macos-latest
                    - windows-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: package-lock.json
            - run: npm ci
            - run: npm test
            - run: npm run build

    docker:
        name: Docker build
        runs-on: ubuntu-latest
        needs:
            - node
            - platform-smoke
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - run: docker build -t ghostclauf:ci .
