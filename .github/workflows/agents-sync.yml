name: AGENTS.md sync check

on:
    push:
        paths:
            - AGENTS.md
            - CLAUDE.md
            - GEMINI.md
            - CONVENTIONS.md
            - .cursorrules
            - .clinerules
            - .windsurfrules
            - .copilot-instructions
            - .github/copilot-instructions.md
            - plan/HANDOFF.md.example
            - CONTRIBUTING.md.example
            - .github/PULL_REQUEST_TEMPLATE.md
            - .github/ISSUE_TEMPLATE.md
            - scripts/sync.py
            - scripts/check_ascii.py
            - scripts/check_us_spelling.py
            - scripts/check_english_only.py
            - scripts/check_hedging.py
    pull_request:
        paths:
            - AGENTS.md
            - CLAUDE.md
            - GEMINI.md
            - CONVENTIONS.md
            - .cursorrules
            - .clinerules
            - .windsurfrules
            - .copilot-instructions
            - .github/copilot-instructions.md
            - plan/HANDOFF.md.example
            - CONTRIBUTING.md.example
            - .github/PULL_REQUEST_TEMPLATE.md
            - .github/ISSUE_TEMPLATE.md
            - scripts/sync.py
            - scripts/check_ascii.py
            - scripts/check_us_spelling.py
            - scripts/check_english_only.py
            - scripts/check_hedging.py

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - run: python3 scripts/sync.py --check
            - run: python3 scripts/check_ascii.py AGENTS.md plan/HANDOFF.md.example CONTRIBUTING.md.example .github/PULL_REQUEST_TEMPLATE.md .github/ISSUE_TEMPLATE.md
            - run: python3 scripts/check_us_spelling.py AGENTS.md plan/HANDOFF.md.example CONTRIBUTING.md.example .github/PULL_REQUEST_TEMPLATE.md .github/ISSUE_TEMPLATE.md
            - run: python3 scripts/check_english_only.py AGENTS.md plan/HANDOFF.md.example CONTRIBUTING.md.example .github/PULL_REQUEST_TEMPLATE.md .github/ISSUE_TEMPLATE.md
            - run: python3 scripts/check_hedging.py AGENTS.md plan/HANDOFF.md.example CONTRIBUTING.md.example .github/PULL_REQUEST_TEMPLATE.md .github/ISSUE_TEMPLATE.md
