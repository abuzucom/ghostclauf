repos:
    - repo: local
      hooks:
          - id: convention-sync-check
            name: Convention Sync Check
            entry: python scripts/sync.py --check
            language: python
            files: ^(AGENTS\.md|CLAUDE\.md|GEMINI\.md|CONVENTIONS\.md|\.cursorrules|\.clinerules|\.windsurfrules|\.github/copilot-instructions\.md|\.copilot-instructions|scripts/sync\.py)$
            pass_filenames: false
          - id: check-ascii
            name: Check ASCII/dash style
            entry: python scripts/check_ascii.py
            language: python
            files: ^(AGENTS\.md|README\.md|CHANGELOG\.md|security\.md)$
          - id: check-branch-name
            name: Check branch name
            entry: python scripts/check_branch_name.py
            language: python
            pass_filenames: false
            stages: [pre-push]
          - id: check-persist-credentials
            name: Check persist-credentials on checkout steps
            entry: python scripts/check_persist_credentials.py
            language: python
            files: ^\.github/workflows/.*\.ya?ml$
          - id: check-weak-hashing
            name: Check for unjustified MD5/SHA-1
            entry: python scripts/check_weak_hashing.py
            language: python
            files: ^(src|test|scripts|hooks)/.*\.(ts|py)$
          - id: check-dockerfile-root
            name: Check for non-root containers
            entry: python scripts/check_dockerfile_root.py
            language: python
            files: ^(Dockerfile.*|docker-compose.*\.ya?ml|compose.*\.ya?ml)$
          - id: check-secrets-heuristic
            name: Check for likely secrets
            entry: python scripts/check_secrets_heuristic.py
            language: python
            files: ^(src|test|scripts|hooks)/.*\.(ts|py)$|^(\.github/workflows/.*\.ya?ml|\.pre-commit-config\.yaml|Makefile|Dockerfile.*|docker-compose.*\.ya?ml)$
